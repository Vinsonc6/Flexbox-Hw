
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lego Store</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Bad+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="topbar">
      <h1>Interesting store</h1>
      <input type="checkbox" id="cart-toggle" class="cart-toggle-input" hidden>
      <label for="cart-toggle" class="cart-toggle">Cart</label>
      <div class="cart"></div>
      <span id="card-total">Total: $0</span>
    </header>

    <nav class="filter-bar" aria-label="Product filter">
      <button id="all-button">All</button>
      <button id="city-button">City</button>
      <button id="creator-button">Creator</button>
      <button id="starwars-button">Star Wars</button>
      <button id="others-button">Others</button>
    </nav>

    <div class="container" id="product-gallery" aria-label="Product gallery">
      
    </div>

    <footer style="text-align:center; color:rgba(255,255,255,0.9); margin:2rem 0;">
      <small>Thanks for shopping with us</small>
    </footer>

    <script src="filter.js"></script>
  </body>
</html>
